<div class="flex items-center flex-col lg:flex-row justify-between gap-4 px-6 py-3 rounded-2xl bg-white">
  <div class="flex justify-between items-center w-full lg:w-12">
    <img [src]="preview()" alt="Image" class="w-12">
    <!-- <app-icon icon="picture" class="w-12 text-blue-600"></app-icon> -->
    <app-icon (click)="remove()" icon="close" class="w-6 text-neutral-500 hover:text-black transition-all cursor-pointer active:scale-95 block lg:hidden"></app-icon>
  </div>
  <div class="flex flex-col w-full lg:w-[calc(100%-94px)]">
    <span
      class="font-medium truncate max-w-full"
    >
      {{ file().name }}
    </span>
    <span class="text-sm text-neutral-600">
      {{ file().size | fileSize }}
    </span>
  </div>
  <app-icon (click)="remove()" icon="close" class="w-6 text-neutral-500 hover:text-black transition-colors cursor-pointer active:scale-95 hidden lg:block"></app-icon>
</div>
